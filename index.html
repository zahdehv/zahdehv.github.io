<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zahdehv | Character Status</title>
    <!-- Importing a retro RPG pixel font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0e15;
            --panel-bg: #1a1c29;
            --border-color: #e0f8cf;
            --text-main: #8be9fd;
            --text-alt: #f1fa8c;
            --hp-color: #ff5555;
            --exp-color: #50fa7b;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Press Start 2P', cursive;
            line-height: 1.6;
            padding: 20px;
            font-size: 12px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }

        /* RPG Panel Styling */
        .panel {
            background-color: var(--panel-bg);
            border: 4px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 5px 5px 0px #000;
        }

        h1, h2, h3 { color: var(--text-alt); margin-top: 0; }
        
        /* Progress Bar Styling */
        .bar-container {
            width: 100%;
            background-color: #000;
            border: 2px solid var(--border-color);
            height: 20px;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        .exp-bar {
            height: 100%;
            background-color: var(--exp-color);
            width: 0%; /* Set by JS */
            transition: width 1s ease-in-out;
        }

        /* Inventory / Repo List Styling */
        .repo-item {
            border-bottom: 2px dashed #444;
            padding: 15px 0;
        }
        .repo-item:last-child { border-bottom: none; }
        .repo-title { color: #ff79c6; text-decoration: none; font-size: 14px;}
        .repo-title:hover { text-decoration: underline; }
        .repo-desc { color: #f8f8f2; font-size: 10px; margin: 10px 0; line-height: 1.4; }
        .badge {
            background: #44475a;
            color: #fff;
            padding: 4px 8px;
            font-size: 8px;
            border-radius: 4px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- LEFT COLUMN: Character Stats -->
        <div class="panel">
            <h2>👤 STATUS</h2>
            <p><strong>NAME:</strong> Zahdehv</p>
            <p><strong>CLASS:</strong> AI Summoner</p>
            <p><strong>LVL:</strong> <span id="current-level">...</span></p>

            <div style="margin-top: 30px;">
                <!-- <p><strong>EXP TO NEXT LVL</strong></p> -->
                <div class="bar-container">
                    <div class="exp-bar" id="exp-bar"></div>
                </div>
                <!-- <p style="text-align: right; font-size: 10px;" id="exp-text">Calculating...</p> -->
            </div>

            <div style="margin-top: 30px;">
                <h3>📊 SKILLS</h3>
                <p>🐍 Python</p>
                <p>🛡️ C#</p>
                <p>⚡ TypeScript</p>
            </div>
        </div>

        <!-- RIGHT COLUMN: Inventory (GitHub Repos) -->
        <div class="panel">
            <h2>🎒 INVENTORY (Artifacts)</h2>
            <!-- <p style="font-size: 10px; color: #888;">*Automatically syncing with GitHub Servers...*</p> -->
            
            <div id="repo-list">
                <p>Loading items...</p>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. CALCULATE EXP TO NEXT LEVEL (BIRTHDAY)
        // ==========================================
        
        // EDIT THESE TWO LINES WITH YOUR BIRTHDAY!
        const birthMonth = 8; // 1 = Jan, 2 = Feb, etc.
        const birthDay = 29;  // Day of the month
        const birthYear = 2002; // Your birth year to calculate current level

        function calculateLevelAndEXP() {
            const today = new Date();
            const currentYear = today.getFullYear();
            
            // Calculate Current Level (Age)
            let nextBirthday = new Date(currentYear, birthMonth - 1, birthDay);
            let age = currentYear - birthYear;
            
            if (today < nextBirthday) {
                age--; // Haven't had birthday this year yet
            } else {
                nextBirthday = new Date(currentYear + 1, birthMonth - 1, birthDay); // Next birthday is next year
            }

            document.getElementById('current-level').innerText = age;

            // Calculate EXP (Days passed since last birthday vs total days in year)
            const lastBirthday = new Date(nextBirthday.getFullYear() - 1, birthMonth - 1, birthDay);
            const totalDaysInYear = (nextBirthday - lastBirthday) / (1000 * 60 * 60 * 24);
            const daysPassed = (today - lastBirthday) / (1000 * 60 * 60 * 24);
            
            const expPercentage = Math.floor((daysPassed / totalDaysInYear) * 100);

            // Update DOM
            document.getElementById('exp-bar').style.width = expPercentage + '%';
            // document.getElementById('exp-text').innerText = `${expPercentage}% | ${Math.ceil(totalDaysInYear - daysPassed)} Days left`;
        }

        // ==========================================
        // 2. FETCH GITHUB REPOSITORIES DYNAMICALLY
        // ==========================================
        async function fetchRepos() {
            const username = 'zahdehv';
            const repoListEl = document.getElementById('repo-list');
            
            try {
                // const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=10`);
                const response = await fetch(`https://api.github.com/users/${username}/repos?per_page=4`);
                const repos = await response.json();
                
                repoListEl.innerHTML = ''; // Clear loading text
                
                repos.forEach(repo => {
                    // Skip forks or empty repos if you want
                    if (repo.fork) return;

                    const languageBadge = repo.language ? `<span class="badge">${repo.language}</span>` : '';
                    const description = repo.description ? repo.description : '*Mysterious unknown artifact...*';

                    const repoHTML = `
                        <div class="repo-item">
                            <a href="${repo.html_url}" target="_blank" class="repo-title">⚔️ ${repo.name}</a>
                            ${languageBadge}
                            <p class="repo-desc">${description}</p>
                        </div>
                    `;
                    repoListEl.innerHTML += repoHTML;
                });
            } catch (error) {
                repoListEl.innerHTML = '<p style="color: red;">Failed to connect to the GitHub network.</p>';
            }
        }

        // Run functions on load
        calculateLevelAndEXP();
        fetchRepos();
    </script>
</body>
</html>
