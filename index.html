<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zahdehv | Character Status</title>
    <!-- Importing a retro RPG pixel font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0e15;
            --panel-bg: #1a1c29;
            --border-color: #e0f8cf;
            --text-main: #8be9fd;
            --text-alt: #f1fa8c;
            --hp-color: #ff5555;
            --exp-color: #50fa7b;
            --item-rarity: #ffb86c;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Press Start 2P', cursive;
            line-height: 1.6;
            padding: 20px;
            font-size: 12px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }

        /* RPG Panel Styling */
        .panel {
            background-color: var(--panel-bg);
            border: 4px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 5px 5px 0px #000;
        }

        h1, h2, h3 { color: var(--text-alt); margin-top: 0; }
        
        /* Progress Bar Styling */
        .bar-container {
            width: 100%;
            background-color: #000;
            border: 2px solid var(--border-color);
            height: 20px;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        .exp-bar {
            height: 100%;
            background-color: var(--exp-color);
            width: 0%; 
            transition: width 1s ease-in-out;
        }

        /* -------------------------------------
           INVENTORY GRID STYLING
           ------------------------------------- */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .inventory-slot {
            width: 65px;
            height: 65px;
            background-color: #000;
            border: 2px solid #444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            text-decoration: none;
            transition: border-color 0.2s, background-color 0.2s, transform 0.1s;
            -webkit-tap-highlight-color: transparent; /* Remove mobile tap highlight */
        }

        .inventory-slot:hover, .inventory-slot.active {
            border-color: var(--text-alt);
            background-color: #222;
            transform: scale(1.05);
            z-index: 10;
        }

        .inventory-slot.empty {
            cursor: default;
            border: 2px dashed #333;
            background-color: transparent;
        }
        .inventory-slot.empty:hover {
            border-color: #333;
            background-color: transparent;
            transform: none;
        }

        /* -------------------------------------
           RPG TOOLTIP STYLING
           ------------------------------------- */
        #rpg-tooltip {
            position: absolute;
            top: 0;
            left: 0;
            background-color: rgba(13, 14, 21, 0.95);
            border: 3px solid var(--item-rarity);
            padding: 15px;
            width: 260px;
            pointer-events: none; /* Prevents tooltip from blocking hover */
            opacity: 0;
            z-index: 1000;
            transition: opacity 0.1s;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.8);
            border-radius: 4px;
        }
        
        #rpg-tooltip.visible { opacity: 1; }

        .tt-title { color: var(--item-rarity); font-size: 11px; margin-bottom: 8px; line-height: 1.4; }
        .tt-type { color: #bd93f9; font-size: 8px; margin-bottom: 12px; }
        .tt-desc { color: #f8f8f2; font-size: 9px; line-height: 1.6; margin-bottom: 12px; }
        .tt-stats { color: #50fa7b; font-size: 9px; border-top: 1px dashed #444; padding-top: 8px; }
        .tt-stats span { display: block; margin-top: 6px; }

        /* Mobile specific hint */
        .tt-mobile-hint { display: none; }

        /* Mobile Tooltip Overrides */
        @media (max-width: 768px) {
            #rpg-tooltip {
                position: fixed !important;
                top: auto !important;
                bottom: 20px !important;
                left: 50% !important;
                transform: translateX(-50%) !important;
                width: 90% !important;
                max-width: 350px;
            }
            .tt-mobile-hint {
                display: block;
                color: #888;
                font-size: 8px;
                margin-top: 12px;
                text-align: center;
                border-top: 1px solid #333;
                padding-top: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- LEFT COLUMN: Character Stats -->
        <div class="panel">
            <h2>👤 STATUS</h2>
            <p><strong>NAME:</strong> Zahdehv</p>
            <p><strong>CLASS:</strong> AI Summoner</p>
            <p><strong>LVL:</strong> <span id="current-level">...</span></p>

            <div style="margin-top: 30px;">
                <div class="bar-container">
                    <div class="exp-bar" id="exp-bar"></div>
                </div>
            </div>

            <div style="margin-top: 30px;">
                <h3>📊 SKILLS</h3>
                <p>🐍 Python</p>
                <p>🛡️ C#</p>
                <p>⚡ TypeScript</p>
            </div>
        </div>

        <!-- RIGHT COLUMN: Inventory (GitHub Repos) -->
        <div class="panel">
            <h2>🎒 INVENTORY (Artifacts)</h2>
            <p style="font-size: 8px; color: #888;">*Hover (or Tap) over artifacts to inspect their properties*</p>
            
            <div id="repo-list" class="inventory-grid">
                <p>Equipping items...</p>
            </div>
        </div>
    </div>

    <!-- The floating hover tooltip -->
    <div id="rpg-tooltip"></div>

    <script>
        // ==========================================
        // 1. CALCULATE EXP TO NEXT LEVEL
        // ==========================================
        const birthMonth = 8; 
        const birthDay = 29;  
        const birthYear = 2002; 

        function calculateLevelAndEXP() {
            const today = new Date();
            const currentYear = today.getFullYear();
            
            let nextBirthday = new Date(currentYear, birthMonth - 1, birthDay);
            let age = currentYear - birthYear;
            
            if (today < nextBirthday) {
                age--;
            } else {
                nextBirthday = new Date(currentYear + 1, birthMonth - 1, birthDay); 
            }

            document.getElementById('current-level').innerText = age;

            const lastBirthday = new Date(nextBirthday.getFullYear() - 1, birthMonth - 1, birthDay);
            const totalDaysInYear = (nextBirthday - lastBirthday) / (1000 * 60 * 60 * 24);
            const daysPassed = (today - lastBirthday) / (1000 * 60 * 60 * 24);
            
            const expPercentage = Math.floor((daysPassed / totalDaysInYear) * 100);

            document.getElementById('exp-bar').style.width = expPercentage + '%';
        }

        // ==========================================
        // 2. FETCH GITHUB REPOSITORIES AS ITEMS
        // ==========================================
        
        function getItemIcon(language) {
            if (!language) return '📦'; 
            const lang = language.toLowerCase();
            if (lang.includes('python')) return '🐍';
            if (lang.includes('c#') || lang.includes('c++')) return '🛡️';
            if (lang.includes('typescript') || lang.includes('javascript')) return '⚡';
            if (lang.includes('html')) return '📜';
            if (lang.includes('css')) return '🎨';
            if (lang.includes('java')) return '☕';
            if (lang.includes('shell')) return '🐚';
            if (lang.includes('rust')) return '⚙️';
            return '🔮'; 
        }

        async function fetchRepos() {
            const username = 'zahdehv';
            const repoListEl = document.getElementById('repo-list');
            const tooltip = document.getElementById('rpg-tooltip');
            
            const MAX_SLOTS = 15; 
            let lastTappedRepo = null; // Used for mobile tap logic

            try {
                // Fetch up to 100 to make sure we don't miss non-forks
                const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=100`);
                const validRepos = await response.json();
                
                // Filter out forks FIRST, then slice up to MAX_SLOTS
                // const  = allRepos.filter(repo => !repo.fork).slice(0, MAX_SLOTS);
                
                repoListEl.innerHTML = ''; 
                let slotsFilled = 0;
                
                validRepos.forEach(repo => {
                    const slot = document.createElement('a');
                    slot.href = repo.html_url;
                    slot.target = '_blank';
                    slot.className = 'inventory-slot';
                    slot.innerHTML = getItemIcon(repo.language);

                    const name = repo.name;
                    const langClass = repo.language ? `${repo.language} Artifact` : 'Unknown Relic';
                    const desc = repo.description ? repo.description : '*A mysterious item radiating strange energy...*';
                    
                    const updateTooltipContent = () => {
                        tooltip.innerHTML = `
                            <div class="tt-title">✦ ${name}</div>
                            <div class="tt-type">Class: ${langClass}</div>
                            <div class="tt-desc">"${desc}"</div>
                            <div class="tt-stats">
                                <span>✨ Magic Power (Stars): ${repo.stargazers_count}</span>
                                <span>🔱 Copies (Forks): ${repo.forks_count}</span>
                            </div>
                            <div class="tt-mobile-hint">Tap again to visit repo ↗</div>
                        `;
                    };

                    const positionTooltip = (e) => {
                        if (window.innerWidth <= 768) return; // CSS handles mobile position

                        // Desktop Bounds Checking
                        let x = e.pageX + 15;
                        let y = e.pageY + 15;
                        const rect = tooltip.getBoundingClientRect();

                        // Prevent going off right edge
                        if (x + rect.width > window.innerWidth) {
                            x = e.pageX - rect.width - 15;
                        }
                        // Prevent going off bottom edge
                        if (e.clientY + rect.height + 15 > window.innerHeight) {
                            y = e.pageY - rect.height - 15;
                        }

                        tooltip.style.left = x + 'px';
                        tooltip.style.top = y + 'px';
                    };

                    // DESKTOP: Hover mechanics
                    slot.addEventListener('mouseenter', (e) => {
                        if (window.innerWidth > 768) {
                            updateTooltipContent();
                            tooltip.classList.add('visible');
                            positionTooltip(e);
                        }
                    });

                    slot.addEventListener('mousemove', (e) => {
                        if (window.innerWidth > 768) positionTooltip(e);
                    });

                    slot.addEventListener('mouseleave', () => {
                        if (window.innerWidth > 768) tooltip.classList.remove('visible');
                    });

                    // MOBILE: Tap once to inspect, tap twice to visit link
                    slot.addEventListener('click', (e) => {
                        if (window.innerWidth <= 768) {
                            if (lastTappedRepo !== repo.name) {
                                e.preventDefault(); // Stop navigation on first tap
                                lastTappedRepo = repo.name;
                                
                                // Highlight selected slot
                                document.querySelectorAll('.inventory-slot').forEach(s => s.classList.remove('active'));
                                slot.classList.add('active');

                                updateTooltipContent();
                                tooltip.classList.add('visible');
                            }
                            // If lastTappedRepo === repo.name, allow default navigation to open the link
                        }
                    });

                    repoListEl.appendChild(slot);
                    slotsFilled++;
                });

                // Fill the rest of the bag with empty slots
                for (let i = slotsFilled; i < MAX_SLOTS; i++) {
                    const emptySlot = document.createElement('div');
                    emptySlot.className = 'inventory-slot empty';
                    repoListEl.appendChild(emptySlot);
                }

                // Global click listener to close tooltip on mobile if tapping outside
                document.addEventListener('click', (e) => {
                    if (window.innerWidth <= 768) {
                        if (!e.target.closest('.inventory-slot') && !e.target.closest('#rpg-tooltip')) {
                            tooltip.classList.remove('visible');
                            lastTappedRepo = null;
                            document.querySelectorAll('.inventory-slot').forEach(s => s.classList.remove('active'));
                        }
                    }
                });

            } catch (error) {
                repoListEl.innerHTML = '<p style="color: red; font-size: 10px;">Failed to connect to the GitHub network. The chest is locked.</p>';
            }
        }

        // Run functions on load
        calculateLevelAndEXP();
        fetchRepos();
    </script>
</body>
</html>
